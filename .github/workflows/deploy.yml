name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend + frontend to EC2
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────────────────
      # 1. Checkout del backend (este repo)
      # ──────────────────────────────────────────────────────
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      # ──────────────────────────────────────────────────────
      # 2. Checkout del frontend (repo hermano del mismo usuario)
      # ──────────────────────────────────────────────────────
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/frontefolio_microservice_front
          path: frontefolio_microservice_front
          token: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────
      # 3. Renombrar carpeta backend para que coincida con la ruta del compose
      # ──────────────────────────────────────────────────────
      - name: Rename backend folder
        run: mv backend frontefolio_microservice

      # ──────────────────────────────────────────────────────
      # 4. Configurar SSH para acceder a la EC2
      # ──────────────────────────────────────────────────────
      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Probar que la clave es parseable
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          echo "✓ Clave SSH OK"
          # ssh-keyscan con timeout y reintentos
          for i in 1 2 3; do
            if ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "✓ Host añadido a known_hosts (intento $i)"
              break
            fi
            echo "ssh-keyscan intento $i falló, reintentando..."
            sleep 5
          done
          # Verificar conectividad SSH
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'echo OK desde $(hostname)'

      # ──────────────────────────────────────────────────────
      # 5. Sincronizar AMBOS repos a la EC2
      # ──────────────────────────────────────────────────────
      - name: Sync backend to EC2
        run: |
          rsync -rltz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.bak' \
            frontefolio_microservice/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/frontefolio/frontefolio_microservice/

      - name: Sync frontend to EC2
        run: |
          rsync -rltz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            frontefolio_microservice_front/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/frontefolio/frontefolio_microservice_front/

      # ──────────────────────────────────────────────────────
      # 6. Escribir el .env en la EC2 a partir de los Secrets
      # ──────────────────────────────────────────────────────
      - name: Write .env on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_SECRET,DB_PASSWORD,VALID_CARDS,DOMAIN
          script: |
            cat > /opt/frontefolio/frontefolio_microservice/.env <<ENVFILE
            PORT=3000
            NODE_ENV=production
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=7d
            DB_HOST=mysql
            DB_PORT=3306
            DB_NAME=frontefolio
            DB_USER=root
            DB_PASSWORD=$DB_PASSWORD
            VALID_CARDS=$VALID_CARDS
            FRONTEND_CUSTOMER_URL=https://$DOMAIN
            FRONTEND_ADMIN_URL=https://$DOMAIN
            AUTH_SERVICE_URL=http://auth-service:3001
            USER_SERVICE_URL=http://user-service:3002
            CATALOG_SERVICE_URL=http://catalog-service:3003
            ORDER_SERVICE_URL=http://order-service:3004
            PAYMENT_SERVICE_URL=http://payment-service:3005
            LOGISTICS_SERVICE_URL=http://logistics-service:3006
            CHAT_SERVICE_URL=http://chat-service:3007
            ENVFILE
            echo "✓ .env escrito ($(wc -l < /opt/frontefolio/frontefolio_microservice/.env) líneas)"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          VALID_CARDS: ${{ secrets.VALID_CARDS }}
          DOMAIN: ${{ secrets.DOMAIN }}

      # ──────────────────────────────────────────────────────
      # 7. Build & up con docker compose (incluye MySQL + 8 servicios + front)
      # ──────────────────────────────────────────────────────
      - name: Build and start containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /opt/frontefolio/frontefolio_microservice
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo ""
            echo "=== Estado de los contenedores ==="
            docker compose ps

      # ──────────────────────────────────────────────────────
      # 8. Smoke test: comprobar que el gateway responde
      # ──────────────────────────────────────────────────────
      - name: Smoke test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Esperando 30s a que arranquen los servicios..."
            sleep 30
            echo "--- Test gateway ---"
            curl -fsS http://127.0.0.1:3000/health && echo " ✓ gateway OK" || echo " ✗ gateway FAIL"
            echo "--- Test frontend ---"
            curl -fsSI http://127.0.0.1:8080/ | head -1 && echo " ✓ frontend OK" || echo " ✗ frontend FAIL"
